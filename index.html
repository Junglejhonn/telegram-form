<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Your Details</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #2481cc;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h2>Enter Your Details</h2>
  <p>We need your real email and phone number for verification.</p>

  <label>Email Address</label>
  <input type="email" id="email" placeholder="e.g. johndoe@gmail.com" required>

  <label>Phone Number</label>
  <input type="tel" id="phone" placeholder="e.g. 8012345678" required>

  <button onclick="submitForm()">Submit</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function submitForm() {
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!email || !phone) {
        tg.showAlert("Please fill in both fields");
        return;
      }

      // Send data back to the bot
      tg.sendData(JSON.stringify({
        email: email,
        phone: phone
      }));

      tg.close();
    }
  </script>
</body>
</html>
